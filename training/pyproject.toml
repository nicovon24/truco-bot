[project]
name = "truco-train"
version = "0.1.0"
description = "Entrenamiento, evaluación y exportación de bots de Truco."
requires-python = ">=3.12,<3.13"
dependencies = [
    "truco-engine",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "msgpack>=1.2.2",
]

[project.scripts]
truco-train = "truco_train.cli:app"

[tool.uv.sources]
truco-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["truco_train"]
